services:
  api:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      # SQLAlchemy resolves the default relative sqlite:///dev.db URI
      # against the Flask instance folder -- persist that folder so data
      # survives container restarts/rebuilds.
      - sqlite_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  sqlite_data:
